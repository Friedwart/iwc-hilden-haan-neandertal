<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mitglieder-Login | Inner Wheel</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: light; }
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 0; display: grid; place-items: center; min-height: 100vh; background: #f7f7fb;
    }
    .card { background:#fff; width:min(420px,92vw); padding:28px 24px; border-radius:16px; box-shadow:0 6px 24px rgba(0,0,0,.08); }
    h1 { margin:0 0 6px; font-size:22px; }
    p  { margin:0 0 18px; color:#555; }
    label { font-weight:600; font-size:14px; }
    input { width:100%; padding:12px 14px; margin:8px 0 14px; border:1px solid #d9dbe3; border-radius:10px; font-size:16px; }
    button { width:100%; padding:12px 14px; border:0; border-radius:10px; background:#1e88e5; color:#fff; font-weight:600; cursor:pointer; transition:background .2s; }
    button:hover{ background:#166fc2; }
    .note { font-size:13px; color:#666; margin-top:10px; }
    .ok{ color:#0a7a36; } .err{ color:#b00020; }
    .link{ display:block; text-align:center; margin-top:12px; color:#4b32b8; text-decoration:none; font-weight:500; }
    .link:hover{ text-decoration:underline; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="card">
    <h1>Mitglieder-Login</h1>
    <p>Gib deine E-Mail ein. Wir senden dir einen sicheren Login-Link.</p>

    <label for="email">E-Mail</label>
    <input id="email" type="email" placeholder="name@beispiel.de" autocomplete="email" required />
    <button id="send">Login-Link senden</button>
    <div id="msg" class="note" role="status" aria-live="polite"></div>

    <a class="link" href="/">← Zurück zur Startseite</a>
  </div>

  <script>
    // >>> Deine Supabase-Daten
    const SUPABASE_URL  = "https://itosmlnylqedxatxmelf.supabase.co";
    const SUPABASE_KEY  = "sb_publishable_1TpKLx_2B6gmbx0BfRDcww_5CUAQBgv"; // publishable key
    const CALLBACK_URL  = window.location.origin + "/auth-callback.html";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const btn  = document.getElementById('send');
    const email = document.getElementById('email');
    const msg  = document.getElementById('msg');

    btn.addEventListener('click', async () => {
      const value = (email.value || "").trim();
      if (!/^\S+@\S+\.\S+$/.test(value)) {
        msg.textContent = "Bitte eine gültige E-Mail eingeben.";
        msg.className = "note err";
        return;
      }
      msg.textContent = "Sende Link…";
      msg.className = "note";

      try {
        const { data, error } = await supabase.auth.signInWithOtp({
          email: value,
          options: {
            emailRedirectTo: CALLBACK_URL,   // <-- zwingt Redirect zum Callback
            shouldCreateUser: true,
          }
        });
        if (error) throw error;

        msg.textContent = "✔️ E-Mail gesendet. Öffne den Link aus der E-Mail.";
        msg.className = "note ok";
        console.log("[OTP sent]", data);
      } catch (e) {
        console.error("[signInWithOtp error]", e);
        msg.textContent = "❌ " + (e?.message || "Fehler beim Senden.");
        msg.className = "note err";
      }
    });
  </script>
</body>
</html>
