<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inner Wheel Club Hilden–Haan–Neandertal</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --bg:#f7f7fb; --card:#fff; --txt:#111827; --muted:#6b7280; --line:#e5e7eb; --brand:#3b82f6; --chip:#eaf2ff; --chip-on:#1f2937; --chip-on-bg:#e5e7eb; }
    *{box-sizing:border-box} html,body{margin:0;height:100%} body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt)}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1100px;margin:0 auto;padding:20px}
    .nav{display:flex;align-items:center;gap:16px;margin-bottom:18px}
    .nav h1{font-size:18px;margin:0;font-weight:700}
    .nav .spacer{flex:1}
    .tabs{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 0}
    .tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:#1f2937}
    .tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
    .pill{border:1px solid var(--line);background:var(--chip);color:#1f2937;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px}
    .pill.toggle{cursor:pointer;user-select:none}
    .pill.toggle.active{background:var(--chip-on-bg)}
    .pill.toggle.disabled{opacity:.45;pointer-events:none}
    .card{background:var(--card);border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.06);padding:22px}
    .header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .h2{font-size:26px;font-weight:800;margin:6px 0 10px}
    .subline{margin-left:auto;font-size:13px;color:var(--muted)}
    .filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
    .list{display:flex;flex-direction:column;gap:22px;margin-top:8px}
    .item{padding:16px 0;border-bottom:1px solid var(--line)}
    .item:last-child{border-bottom:none}
    .title{font-size:18px;font-weight:700;margin:0 0 6px}
    .meta{font-size:14px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    .badge{background:#eaf2ff;color:#1f2937;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600;margin-left:8px}
    .desc{margin:8px 0 0;font-size:15px;color:#1f2937;line-height:1.45}
    .muted{color:var(--muted)}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .bar{display:flex;gap:10px;flex-wrap:wrap}
    .footer{color:var(--muted);text-align:center;font-size:12px;padding:24px 0}
    .link{color:var(--brand)}
    .topnav{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
    .topnav .chip{background:#eaf2ff;border-radius:999px;padding:8px 12px;font-weight:600;font-size:14px}
    .admin{margin-left:auto}
    @media (max-width:720px){ .h2{font-size:22px} .title{font-size:17px} }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Kopf / Navigation -->
    <div class="nav">
      <img src="/assets/logo.png" alt="IWC Logo" width="36" height="36" style="border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.08)">
      <h1>Inner Wheel Club Hilden–Haan–Neandertal</h1>
      <div class="spacer"></div>
      <div class="topnav">
        <span class="chip">Termine</span>
        <a href="#downloads" class="chip">Downloads</a>
        <a href="#about" class="chip">Über uns</a>
        <a href="/admin/index.html" class="chip admin">Admin</a>
      </div>
    </div>

    <!-- Termine-Karte -->
    <div class="card">
      <div class="header">
        <div class="h2">Termine &amp; Veranstaltungen</div>
        <div class="subline"><span id="count">–</span> Termine</div>
      </div>

      <!-- View-Tabs: Nur Kommende / Vergangene -->
      <div class="bar" id="viewTabs">
        <button class="tab" data-view="upcoming" id="btnUpcoming">Kommende</button>
        <button class="tab" data-view="past" id="btnPast">Vergangene</button>
      </div>

      <!-- Kategorie-Filter (togglebare Pills) -->
      <div class="filters" id="catFilters"><!-- dynamisch --></div>

      <!-- Liste -->
      <div class="list" id="list"></div>

      <div style="margin-top:8px">
        <a class="link" href="#downloads">→ Zum Downloadbereich</a>
      </div>
    </div>

    <div class="footer">© 2025 Inner Wheel Club Hilden–Haan–Neandertal</div>
  </div>

  <script>
    // ---- Utilities ---------------------------------------------------------
    const $ = (sel, el=document) => el.querySelector(sel);
    const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));
    const fmtDate = (iso) => {
      if (!iso) return '';
      const d = new Date(iso);
      return new Intl.DateTimeFormat('de-DE', { day:'2-digit', month:'2-digit', year:'numeric' }).format(d);
    };
    const isPast = (isoEndOrStart) => {
      if (!isoEndOrStart) return false;
      const t = new Date(isoEndOrStart).getTime();
      const now = Date.now();
      return t < now;
    };

    // URL-Param-Handling (view, cat)
    const getParams = () => {
      const u = new URL(window.location.href);
      return {
        view: (u.searchParams.get('view') || 'upcoming'),
        cat: (u.searchParams.get('cat') || 'all')
      };
    };
    const setParams = (patch) => {
      const u = new URL(window.location.href);
      Object.entries(patch).forEach(([k,v]) => v ? u.searchParams.set(k, v) : u.searchParams.delete(k));
      history.replaceState(null, '', u.toString());
    };

    // ---- Daten laden -------------------------------------------------------
    let ALL = [];         // alle Events roh
    let CATS = [];        // Kategorien
    let STATE = { view: 'upcoming', cat: 'all' };

    async function load() {
      // Cache-Buster: holt immer frische JSON (wichtig nach Admin-Änderungen)
      const url = `/content/events.json?cb=${Date.now()}`;
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('Laden fehlgeschlagen');
      const json = await res.json();
      ALL = (json.items || [])
        .map(e => ({
          title: e.title || '',
          category: (e.category || '').toLowerCase(),
          start: e.start || '',
          end: e.end || '',
          location: e.location || '',
          description: e.description || '',
          rsvp_link: e.rsvp_link || '',
          capacity: e.capacity || null
        }))
        // Sicherheit: sortiere nach Startdatum aufsteigend
        .sort((a,b) => new Date(a.start) - new Date(b.start));

      // Kategorien ermitteln in sinnvoller Reihenfolge
      const order = ['clubmeeting', 'private-charity', 'club-charity'];
      const set = new Set(ALL.map(e => e.category).filter(Boolean));
      CATS = order.filter(c => set.has(c)).concat([...set].filter(c => !order.includes(c)));

      // Initialen STATE aus URL
      const p = getParams();
      STATE.view = (p.view === 'past') ? 'past' : 'upcoming';
      STATE.cat  = p.cat && p.cat !== 'all' ? p.cat : 'all';

      renderTabs();
      renderCatFilters();
      renderList();
    }

    // ---- Render: Tabs ------------------------------------------------------
    function renderTabs() {
      const tabs = $$('#viewTabs .tab');
      tabs.forEach(b => b.classList.toggle('active', b.dataset.view === STATE.view));
      $('#btnUpcoming').onclick = () => {
        STATE.view = 'upcoming';
        setParams({ view:'upcoming' });
        renderTabs(); renderList();
      };
      $('#btnPast').onclick = () => {
        STATE.view = 'past';
        setParams({ view:'past' });
        renderTabs(); renderList();
      };
    }

    // ---- Render: Kategorie-Filter -----------------------------------------
    function renderCatFilters() {
      const box = $('#catFilters');
      box.innerHTML = '';
      // "Alle Kategorien" Pill
      const allPill = document.createElement('button');
      allPill.className = 'pill toggle ' + (STATE.cat==='all' ? 'active' : '');
      allPill.textContent = 'Alle';
      allPill.onclick = () => { STATE.cat = 'all'; setParams({ cat:'all' }); renderCatFilters(); renderList(); };
      box.appendChild(allPill);

      CATS.forEach(cat => {
        const pill = document.createElement('button');
        pill.className = 'pill toggle' + (STATE.cat===cat ? ' active' : '');
        pill.textContent = labelCat(cat);
        pill.onclick = () => {
          STATE.cat = (STATE.cat === cat ? 'all' : cat);
          setParams({ cat: STATE.cat });
          renderCatFilters();
          renderList();
        };
        box.appendChild(pill);
      });
    }

    function labelCat(c){
      if (c === 'clubmeeting') return 'Clubmeetings';
      if (c === 'private-charity') return 'Private Charity';
      if (c === 'club-charity') return 'Club Charity';
      return c;
    }

    // ---- Render: Liste -----------------------------------------------------
    function renderList() {
      const list = $('#list');
      list.innerHTML = '';

      // nach View filtern
      const filteredByTime = ALL.filter(e => {
        const ref = e.end || e.start;
        return STATE.view === 'past' ? isPast(ref) : !isPast(ref);
      });

      // nach Kategorie filtern
      const filtered = STATE.cat === 'all'
        ? filteredByTime
        : filteredByTime.filter(e => e.category === STATE.cat);

      // sortierung: kommende aufsteigend, vergangene absteigend
      filtered.sort((a,b) => {
        const ta = new Date(a.start).getTime();
        const tb = new Date(b.start).getTime();
        return STATE.view === 'past' ? (tb - ta) : (ta - tb);
      });

      // Count aktualisieren
      $('#count').textContent = filtered.length.toString();

      if (!filtered.length) {
        const div = document.createElement('div');
        div.className = 'muted';
        div.style.padding = '6px 0 2px';
        div.textContent = STATE.view==='past'
          ? 'Keine vergangenen Termine.'
          : 'Keine kommenden Termine.';
        list.appendChild(div);
        return;
      }

      // render items
      filtered.forEach(e => list.appendChild(renderItem(e)));
    }

    function renderItem(e) {
      const div = document.createElement('div');
      div.className = 'item';

      const t = document.createElement('h3');
      t.className = 'title';
      t.textContent = e.title || 'Ohne Titel';

      const meta = document.createElement('div');
      meta.className = 'meta';
      const mDate = document.createElement('span');
      mDate.textContent = fmtDate(e.start);
      const dot = document.createElement('span'); dot.textContent = '·';
      const mLoc = document.createElement('span');
      mLoc.textContent = e.location || '—';
      const bCat = document.createElement('span');
      bCat.className = 'badge';
      bCat.textContent = labelCat(e.category) || '';

      meta
