<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inner Wheel Club Hilden–Haan–Neandertal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: light; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f6f7fb;
      margin: 0;
      color: #111;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e8e9f0;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 16px; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    nav a {
      text-decoration: none;
      background: #e9f0ff;
      color: #174ea6;
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 600;
      transition: background 0.2s;
    }
    nav a:hover, nav a.active {
      background: #174ea6;
      color: #fff;
    }
    main .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0,0,0,.06);
      padding: 22px;
      margin: 20px 0;
    }
    h1 { margin: 0 0 12px; font-size: 24px; }
    .switch {
      display: inline-flex;
      border: 1px solid #e3e5ee;
      border-radius: 999px;
      padding: 4px;
      background: #f7f8fd;
      margin-bottom: 14px;
    }
    .switch button {
      border: 0;
      background: transparent;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      color: #3b3f55;
    }
    .switch button.active {
      background: #174ea6;
      color: #fff;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .chip {
      border: 1px solid #e3e5ee;
      background: #fff;
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .chip.active {
      background: #174ea6;
      color: #fff;
    }
    .count { color: #666; font-size: 14px; margin-top: 4px; }
    .event {
      padding: 16px 0;
      border-top: 1px solid #eef0f4;
    }
    .event:first-child { border-top: 0; }
    .event a {
      color: #174ea6;
      text-decoration: none;
      font-weight: 700;
    }
    .meta {
      color: #666;
      margin: 4px 0 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .badge {
      background: #eef4ff;
      color: #174ea6;
      padding: 4px 8px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 12px;
    }
    footer {
      color: #666;
      font-size: 14px;
      text-align: center;
      padding: 28px 0 36px;
    }
    .muted { color: #6b7280; }
    .pill {
      background: #e9f0ff;
      color: #174ea6;
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .event.past { opacity: 0.6; transform: scale(0.99); }
    .event.past a { color: #555; font-style: italic; }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <div class="brand">
        <img src="/assets/logo.png" alt="Logo Inner Wheel Club" width="36" height="36">
        <div>Inner Wheel Club Hilden–Haan–Neandertal</div>
      </div>
      <nav>
        <a href="/index.html" class="active">Termine</a>
        <a href="/about.html">Über uns</a>
        <a href="/organisation.html">Organisation Charity</a>
        <a href="/bestellungen.html">Bestellungen</a>
        <a href="/downloads.html">Downloads</a>
        <a href="/admin/index.html">Admin</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="card">
      <h1>Termine & Veranstaltungen</h1>

      <div class="switch">
        <button id="btn-upcoming" class="active">Kommende</button>
        <button id="btn-past">Vergangene</button>
      </div>

      <div class="filters" id="filterBar">
        <button class="chip active" data-cat="all">Alle Kategorien</button>
        <button class="chip" data-cat="clubmeeting">Clubmeetings</button>
        <button class="chip" data-cat="private-charity">Private Charity</button>
        <button class="chip" data-cat="club-charity">Club Charity</button>
      </div>

      <div class="count" id="count"></div>
      <div id="events" class="muted">Wird geladen…</div>

      <p style="margin-top:18px;">
        <a class="pill" href="/downloads.html">→ Zum Downloadbereich</a>
      </p>
    </div>
  </main>

  <footer>© 2025 Inner Wheel Club Hilden–Haan–Neandertal</footer>

  <script>
    const $ = s => document.querySelector(s);
    const $$ = s => Array.from(document.querySelectorAll(s));
    const fmtDate = iso => new Date(iso).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
    const catLabel = v => ({
      "clubmeeting": "Clubmeeting",
      "private-charity": "Private Charity",
      "club-charity": "Club Charity"
    }[v] || "Termin");

    let allItems = [];
    const state = { view: "upcoming", cat: "all" };

    function render() {
      const today = new Date(); today.setHours(0,0,0,0);
      let items = allItems.filter(it => {
        const d = new Date(it.start);
        return state.view === "upcoming" ? d >= today : d < today;
      });
      if (state.cat !== "all") items = items.filter(it => it.category === state.cat);
      items.sort((a,b)=> new Date(a.start) - new Date(b.start));
      if (state.view === "past") items.reverse();

      $("#count").textContent = `${items.length} ${items.length === 1 ? "Termin" : "Termine"}`;
      $("#events").innerHTML = items.map(ev=>{
        const d = new Date(ev.start);
        const past = d < today;
        return `
        <div class="event ${past?"past":""}">
          <a href="#">${ev.title}</a>
          <div class="meta">
            <span>${fmtDate(ev.start)}</span> ·
            <span>${ev.location||"Ort folgt"}</span>
            <span class="badge">${catLabel(ev.category)}</span>
          </div>
          <div>${ev.description||""}</div>
        </div>`;
      }).join("") || `<div class="muted">${state.view==="upcoming"?"Keine kommenden Termine.":"Keine vergangenen Termine."}</div>`;
    }

    (async()=>{
      const res = await fetch(`/content/events.json?v=${Date.now()}`);
      const data = await res.json();
      allItems = data.items || [];
      render();
    })();

    $("#btn-upcoming").onclick = () => {
      state.view = "upcoming";
      $("#btn-upcoming").classList.add("active");
      $("#btn-past").classList.remove("active");
      render();
    };
    $("#btn-past").onclick = () => {
      state.view = "past";
      $("#btn-past").classList.add("active");
      $("#btn-upcoming").classList.remove("active");
      render();
    };
    $("#filterBar").onclick = e => {
      const btn = e.target.closest(".chip");
      if(!btn) return;
      state.cat = btn.dataset.cat;
      $$(".chip").forEach(c => c.classList.toggle("active", c === btn));
      render();
    };
  </script>
</body>
</html>
