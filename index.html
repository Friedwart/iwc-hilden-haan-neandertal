<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inner Wheel Club Hilden–Haan–Neandertal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; }
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; background:#f7f7fb; color:#0f172a; margin:0; }
    .top { max-width:1100px; margin:0 auto; padding:18px 16px; display:flex; align-items:center; gap:12px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; }
    .brand img { width:28px; height:28px; }
    .nav { margin-left:auto; display:flex; gap:10px; }
    .nav a { text-decoration:none; background:#e7efff; color:#0f172a; padding:8px 12px; border-radius:999px; font-weight:600; border:1px solid #d0defe; }
    .main { max-width:1100px; margin:0 auto 80px; padding: 0 16px; }
    .panel { background:#fff; border:1px solid #e2e8f0; border-radius:16px; box-shadow:0 2px 0 rgba(0,0,0,.02); margin-top:14px; }
    .panel h2 { font-size:26px; padding:18px 18px 8px; margin:0; }
    .filters { display:flex; gap:8px; flex-wrap:wrap; padding:0 16px 12px; }
    .chip { border:1px solid #cbd5e1; background:#f8fafc; color:#0f172a; border-radius:999px; padding:8px 12px; font-weight:700; cursor:pointer; }
    .chip.active { background:#2b6df6; border-color:#2b6df6; color:#fff; }
    .list { padding: 6px 2px 12px; }
    .item { padding:16px; border-top:1px solid #eef2f7; }
    .item:first-child { border-top:none; }
    .title { font-size:18px; font-weight:800; margin:0 0 6px; }
    .meta { font-size:14px; color:#334155; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .meta .tag { font-size:12px; padding:4px 8px; border-radius:999px; background:#eef2ff; color:#1e40af; border:1px solid #c7d2fe; }
    .desc { margin-top:8px; color:#0f172a; }
    .row { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .btn { appearance:none; border:1px solid #2563eb; background:#2563eb; color:#fff; padding:8px 12px; border-radius:10px; font-weight:700; text-decoration:none; }
    .btn[disabled] { opacity:.6; pointer-events:none; }
    .muted { color:#64748b; }
    .count { margin-left:auto; color:#64748b; font-size:14px; padding-right:18px; }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="/assets/logo.png" alt="" />
      <div>Inner Wheel Club Hilden–Haan–Neandertal</div>
    </div>
    <nav class="nav">
      <a href="/">Termine</a>
      <a href="#ueber-uns">Über uns</a>
      <a href="/downloads.html">Downloads</a>
      <a href="/admin/">Admin</a>
    </nav>
  </header>

  <main class="main">
    <section class="panel">
      <h2>Termine & Veranstaltungen</h2>

      <div class="filters" id="filterBar">
        <button class="chip active" data-scope="upcoming">Kommende</button>
        <button class="chip" data-scope="past">Vergangene</button>
        <span class="chip" data-cat="clubmeeting">Clubmeetings</span>
        <span class="chip" data-cat="private-charity">Private Charity</span>
        <span class="chip" data-cat="club-charity">Club Charity</span>
        <span class="count" id="count"></span>
      </div>

      <div class="list" id="list"></div>
      <div style="padding: 0 16px 16px;">
        <a class="btn" href="/downloads.html">→ Zum Downloadbereich</a>
      </div>
    </section>
  </main>

  <script>
    // ======= Konfiguration =======
    // Trage hier den Basis-Link zu deinem Google-Formular ein.
    // Die Seite hängt automatisch ?event=<Titel>&date=<YYYY-MM-DD> an.
    const RSVP_BASE_URL = "https://example.com/forms/rsvp"; // <- HIER EINMALIG ANPASSEN

    const DATA_URL = "/content/events.json";

    // ======= State / Filter =======
    let rawItems = [];
    let scope = "upcoming"; // "upcoming" | "past"
    let cats = new Set();   // ausgewählte Kategorien (leer = alle)

    // ======= Helpers =======
    const $ = (s, c=document)=> c.querySelector(s);
    const $$ = (s, c=document)=> Array.from(c.querySelectorAll(s));
    const fmtDate = (iso) => {
      if (!iso) return "";
      const d = new Date(iso);
      return d.toLocaleDateString("de-DE", { day:"2-digit", month:"2-digit", year:"numeric" });
    };
    const todayISO = () => new Date().toISOString().slice(0,10);

    function isUpcoming(it) {
      const d = (it.start||"").slice(0,10);
      return d >= todayISO();
    }

    function visible(items){
      // Scope
      let res = items.filter(it => scope === "upcoming" ? isUpcoming(it) : !isUpcoming(it));
      // Kategorien
      if (cats.size) res = res.filter(it => cats.has(it.category));
      // Sortierung
      res.sort((a,b)=> (a.start||"").localeCompare(b.start||""));
      if (scope === "past") res.reverse();
      return res;
    }

    function badge(label){
      const span = document.createElement("span");
      span.className = "tag";
      span.textContent = label;
      return span;
    }

    function buildRSVPLink(it){
      // 1) Falls vorhandener rsvp_link (Legacy) → benutzen
      if (it.rsvp_link && it.rsvp_link.trim()) return it.rsvp_link.trim();
      // 2) Falls keine Anmeldung erforderlich → kein Link
      if (!it.rsvp_required) return "";
      // 3) Sonst aus Basis + Parametern generieren
      if (!RSVP_BASE_URL) return ""; // kein Basislink gesetzt → kein Button
      const u = new URL(RSVP_BASE_URL, location.origin);
      u.searchParams.set("event", it.title || "");
      u.searchParams.set("date", (it.start||"").slice(0,10));
      return u.toString();
    }

    function render(){
      const list = $("#list");
      list.innerHTML = "";
      const items = visible(rawItems);

      $("#count").textContent = `${items.length} Termin${items.length===1?"":"e"}`;

      items.forEach(it=>{
        const wrap = document.createElement("div");
        wrap.className = "item";

        const row = document.createElement("div");
        row.className = "row";

        const left = document.createElement("div");
        const title = document.createElement("h3"); title.className="title"; title.textContent = it.title || "—";
        const meta = document.createElement("div"); meta.className="meta";
        meta.append(
          document.createTextNode(fmtDate(it.start)),
          document.createTextNode(" · "),
          document.createTextNode(it.location || "—")
        );
        // Kategorie-Badge
        const catMap = {
          "clubmeeting": "Clubmeeting",
          "private-charity": "Private Charity",
          "club-charity": "Club Charity"
        };
        meta.append(badge(catMap[it.category] || it.category || "Kategorie"));
        left.append(title, meta);

        if (it.description) {
          const d = document.createElement("div");
          d.className = "desc";
          d.textContent = it.description;
          left.appendChild(d);
        }

        const right = document.createElement("div");
        const rsvpURL = buildRSVPLink(it);
        if (rsvpURL) {
          const btn = document.createElement("a");
          btn.className = "btn";
          btn.href = rsvpURL;
          btn.target = "_blank";
          btn.rel="noopener";
          btn.textContent = "Anmelden";
          right.appendChild(btn);
        } else {
          const m = document.createElement("div");
          m.className = "muted";
          m.textContent = it.rsvp_required ? "Anmeldung nicht verfügbar." : "Keine Anmeldung erforderlich.";
          right.appendChild(m);
        }

        row.append(left, right);
        wrap.appendChild(row);
        list.appendChild(wrap);
      });
    }

    function attachFilters(){
      // Scope-Toggle
      $$('.chip[data-scope]').forEach(ch=>{
        ch.addEventListener('click', ()=>{
          $$('.chip[data-scope]').forEach(x=> x.classList.remove('active'));
          ch.classList.add('active');
          scope = ch.dataset.scope;
          render();
        });
      });

      // Kategorien
      $$('.chip[data-cat]').forEach(ch=>{
        ch.addEventListener('click', ()=>{
          const cat = ch.dataset.cat;
          if (cats.has(cat)) { cats.delete(cat); ch.classList.remove('active'); }
          else { cats.add(cat); ch.classList.add('active'); }
          render();
        });
      });
    }

    async function boot(){
      try {
        const res = await fetch(DATA_URL, { cache: "no-store" });
        const data = await res.json();
        // Normalize + sichere Defaults
        rawItems = (data.items || []).map(e => ({
          ...e,
          rsvp_required: typeof e.rsvp_required === "boolean" ? e.rsvp_required : !!(e.rsvp_link && e.rsvp_link.trim())
        }));
      } catch(e){
        rawItems = [];
        console.error(e);
      }
      attachFilters();
      render();
    }

    boot();
  </script>
</body>
</html>
