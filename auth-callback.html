<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login wird abgeschlossen …</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: light; }
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 0; display: grid; place-items: center; min-height: 100vh; background:#f7f7fb;
    }
    .card { background:#fff; padding:28px 24px; border-radius:16px; box-shadow:0 6px 24px rgba(0,0,0,.08); width:min(640px, 92vw); }
    h1 { margin:0 0 6px; font-size:26px; }
    p  { margin:0; color:#444; }
    .err { color:#b00020; margin-top:8px; white-space:pre-wrap }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="card">
    <h1>Bitte einen Moment …</h1>
    <p>Wir schließen deinen Login ab und leiten dich weiter.</p>
    <p id="err" class="err" hidden></p>
  </div>

  <script>
    // === Deine Supabase-Daten (wie in login.html) ===
    const SUPABASE_URL = "https://itosmlnylqedxatxmelf.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1TpKLx_2B6gmbx0BfRDcww_5CUAQBgv";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const showError = (msg) => {
      const el = document.getElementById('err');
      el.textContent = "Fehler beim Login: " + msg;
      el.hidden = false;
    };

    // Helper: Hash (#a=b&c=d) in Objekt umwandeln
    function parseHash(hash) {
      const out = {};
      const h = (hash || "").replace(/^#/, "");
      if (!h) return out;
      for (const part of h.split("&")) {
        const [k, v] = part.split("=");
        if (k) out[decodeURIComponent(k)] = decodeURIComponent(v || "");
      }
      return out;
    }

    (async () => {
      try {
        const hash = parseHash(window.location.hash);
        const params = new URLSearchParams(window.location.search);

        // 1) Klassischer Magic-Link mit Tokens im Hash
        if (hash.access_token && hash.refresh_token) {
          const { error } = await supabase.auth.setSession({
            access_token: hash.access_token,
            refresh_token: hash.refresh_token,
          });
          if (error) throw error;
          window.location.replace("/");
          return;
        }

        // 2) PKCE/OAuth-Flow: ?code=...
        if (params.get("code")) {
          const { error } = await supabase.auth.exchangeCodeForSession(params.get("code"));
          if (error) throw error;
          window.location.replace("/");
          return;
        }

        // 3) E-Mail-Bestätigungen (signup/magiclink/recovery/invite) mit ?token_hash=...&type=...
        if (params.get("token_hash") && params.get("type")) {
          const { error } = await supabase.auth.verifyOtp({
            token_hash: params.get("token_hash"),
            type: params.get("type"),
          });
          if (error) throw error;
          window.location.replace("/");
          return;
        }

        // Nichts Passendes in der URL gefunden
        throw new Error("Keine Token/Parameter in der URL gefunden. Öffne den Link direkt aus der E-Mail erneut.");
      } catch (e) {
        showError(e.message || String(e));
      }
    })();
  </script>
</body>
</html>
