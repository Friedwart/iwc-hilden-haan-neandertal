<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anmeldung wird abgeschlossen…</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
         margin:0;display:grid;place-items:center;min-height:100vh;background:#f7f7fb}
    .card{background:#fff;padding:28px 24px;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.08);width:min(520px,92vw)}
    h1{font-size:20px;margin:0 0 8px}
    .msg{color:#555}
    .ok{color:#0a7a36}.err{color:#b00020}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="card">
    <h1>Anmeldung wird abgeschlossen…</h1>
    <p id="msg" class="msg">Bitte einen Moment.</p>
  </div>

  <script>
    const SUPABASE_URL = "https://itosmlnylqedxatxmelf.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1TpKLx_2B6gmbx0BfRDcww_5CUAQBgv";

    const supabase = supabasejs.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const msg = document.getElementById('msg');

    (async () => {
      try {
        const { error } = await supabase.auth.exchangeCodeForSession(window.location.href);
        if (error) {
          msg.textContent = "❌ Anmeldung fehlgeschlagen: " + (error.message || "Unbekannter Fehler");
          msg.className = "msg err";
          return;
        }
        msg.textContent = "✔️ Anmeldung erfolgreich. Weiterleitung…";
        msg.className = "msg ok";
        setTimeout(() => { window.location.href = "/"; }, 800);
      } catch (e) {
        msg.textContent = "❌ Unerwarteter Fehler: " + e.message;
        msg.className = "msg err";
      }
    })();
  </script>
</body>
</html>
