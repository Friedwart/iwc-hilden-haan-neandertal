<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login wird abgeschlossen …</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f7f7fb;
    }
    .card {
      background: #fff;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 6px 24px rgba(0,0,0,.08);
      width: min(520px, 92vw);
    }
    .muted {
      color: #666;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="card">
    <h1>Bitte einen Moment …</h1>
    <p class="muted">Wir schließen deinen Login ab und leiten dich weiter.</p>
    <div id="msg" class="muted"></div>
  </div>

  <script>
    // 🔑 Supabase-Verbindungsdaten
    const SUPABASE_URL = "https://itosmlnylqedxatxmelf.supabase.co";
    // Verwende hier deinen neuen Publishable Key (funktioniert auch mit dem anon key)
    const SUPABASE_KEY = "sb_publishable_1TpKLx_2B6gmbx0BfRDcww_5CUAQBgv";

    const supabase = supabasejs.createClient(SUPABASE_URL, SUPABASE_KEY);
    const msg = document.getElementById('msg');

    (async () => {
      try {
        // Token aus der URL (#access_token=...&refresh_token=...)
        const hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : '';
        const params = new URLSearchParams(hash);
        const access_token  = params.get('access_token');
        const refresh_token = params.get('refresh_token');

        if (access_token && refresh_token) {
          const { error } = await supabase.auth.setSession({ access_token, refresh_token });
          if (error) throw error;

          // Hash entfernen & zur Startseite weiterleiten
          history.replaceState({}, '', window.location.pathname);
          window.location.replace('/');
        } else {
          msg.textContent = '⚠️ Kein Login-Token gefunden. Bitte starte den Login erneut.';
          setTimeout(() => window.location.replace('/login.html'), 2500);
        }
      } catch (e) {
        console.error(e);
        msg.textContent = '❌ Login konnte nicht abgeschlossen werden: ' + (e?.message || 'Unbekannter Fehler');
        setTimeout(() => window.location.replace('/login.html'), 3000);
      }
    })();
  </script>
</body>
</html>
