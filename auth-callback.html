<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login wird abgeschlossen …</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 0; display: grid; place-items: center; min-height: 100vh;
      background: #f7f7fb; color: #333;
    }
    .card {
      background:#fff; padding:28px 24px; border-radius:16px;
      box-shadow:0 6px 24px rgba(0,0,0,.08); width:min(520px,92vw); text-align:center;
    }
    h1{font-size:22px;margin-bottom:6px}
    p{color:#555;margin:0 0 12px}
    .err{color:#b00020;margin-top:12px;font-weight:600;white-space:pre-wrap}
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="card">
    <h1>Bitte einen Moment …</h1>
    <p>Wir schließen deinen Login ab und leiten dich weiter.</p>
    <p id="error" class="err" hidden></p>
  </div>

  <script>
    // --- Supabase Verbindungsdaten ---
    const SUPABASE_URL = "https://itosmlnylqedxatxmelf.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1TpKLx_2B6gmbx0BfRDcww_5CUAQBgv";
    const REDIRECT_AFTER = "/admin/"; // Ziel nach erfolgreichem Login

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    function parseHash() {
      const h = (window.location.hash || "").replace(/^#/, "");
      return Object.fromEntries(new URLSearchParams(h));
    }

    (async () => {
      const showErr = (msg) => {
        const el = document.getElementById("error");
        el.hidden = false;
        el.textContent = "Fehler beim Login: " + msg;
      };

      try {
        // 1) Magic-Link-Fall: Tokens im URL-Hash (#access_token / #refresh_token)
        const hashParams = parseHash();
        const access_token = hashParams["access_token"];
        const refresh_token = hashParams["refresh_token"];

        if (access_token && refresh_token) {
          const { error } = await supabase.auth.setSession({ access_token, refresh_token });
          if (error) throw error;
          window.location.replace(REDIRECT_AFTER);
          return;
        }

        // 2) OAuth/PKCE-Fall (nur zur Vollständigkeit): ?code=… in der Query
        const qs = new URLSearchParams(window.location.search);
        const code = qs.get("code");
        if (code) {
          const { error } = await supabase.auth.exchangeCodeForSession(window.location.search);
          if (error) throw error;
          window.location.replace(REDIRECT_AFTER);
          return;
        }

        // Weder Hash-Tokens noch Code vorhanden
        showErr("Keine Token in der URL gefunden. Öffne den Link aus der E-Mail erneut.");
      } catch (err) {
        showErr(err?.message || String(err));
      }
    })();
  </script>
</body>
</html>
