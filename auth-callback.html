<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login wird abgeschlossen … | Inner Wheel</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: #f7f7fb;
    }
    .card {
      background: #fff;
      padding: 28px 24px;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0,0,0,.08);
      width: min(420px, 92vw);
      text-align: center;
    }
    h1 { font-size: 20px; margin-bottom: 10px; }
    p { color:#555; margin: 0 0 10px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="card">
    <h1>Bitte einen Moment …</h1>
    <p>Wir schließen deinen Login ab und leiten dich weiter.</p>
  </div>

  <script>
    // Supabase Setup
    const SUPABASE_URL = "https://itosmlnylqedxatxmelf.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1TpKLx_2B6gmbx0BfRDcww_5CUAQBgv";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    async function completeLogin() {
      try {
        // Liest die Token-Parameter aus der URL (nach #access_token=...)
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const access_token = hashParams.get("access_token");
        const refresh_token = hashParams.get("refresh_token");

        if (!access_token || !refresh_token) {
          throw new Error("Kein Token erhalten.");
        }

        // Session speichern
        const { error } = await supabase.auth.setSession({
          access_token,
          refresh_token
        });
        if (error) throw error;

        // ✅ Erfolgreich eingeloggt → weiterleiten zur Startseite
        window.location.href = "/";
      } catch (err) {
        document.body.innerHTML = `
          <div class="card">
            <h1>❌ Fehler beim Login</h1>
            <p>${err.message}</p>
            <a href="/login.html">Zurück zum Login</a>
          </div>
        `;
      }
    }

    completeLogin();
  </script>
</body>
</html>
