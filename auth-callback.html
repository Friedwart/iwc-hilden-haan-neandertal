<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login wird abgeschlossen …</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: #f7f7fb;
      color: #333;
    }
    .card {
      background: #fff;
      padding: 28px 24px;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0,0,0,.08);
      width: min(520px, 92vw);
      text-align: center;
    }
    h1 { font-size: 22px; margin-bottom: 6px; }
    p  { color: #555; margin: 0 0 12px; }
    .err { color: #b00020; margin-top: 12px; font-weight: 500; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="card">
    <h1>Bitte einen Moment …</h1>
    <p>Wir schließen deinen Login ab und leiten dich weiter.</p>
    <p id="error" class="err" hidden></p>
  </div>

  <script>
    // --- Supabase Verbindungsdaten ---
    const SUPABASE_URL = "https://itosmlnylqedxatxmelf.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1TpKLx_2B6gmbx0BfRDcww_5CUAQBgv";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // --- Login abschließen & Session speichern ---
    (async () => {
      try {
        // Extrahiere Token-Parameter aus der URL und tausche sie gegen Session
        const { error } = await supabase.auth.exchangeCodeForSession(window.location.hash);
        if (error) throw error;

        // Prüfe, ob ein Nutzer jetzt eingeloggt ist
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) throw new Error("Kein Benutzer gefunden.");

        // Weiterleitung in den Admin-Bereich
        window.location.replace("/admin/");
      } catch (err) {
        const el = document.getElementById("error");
        el.hidden = false;
        el.textContent = "Fehler beim Login: " + (err?.message || err);
      }
    })();
  </script>
</body>
</html>
