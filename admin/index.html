<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Adminbereich | IWC App</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background:#f7f7fb; color:#111827;
    }
    .wrap{max-width:1100px; margin:32px auto; padding:0 16px}
    h1{font-size:28px; margin:0 0 12px}
    .sub{color:#059669; font-size:14px; margin-bottom:16px}
    .topbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:16px 0 20px}
    .btn{
      border:0; border-radius:10px; padding:10px 14px; background:#2563eb; color:#fff;
      font-weight:600; cursor:pointer; box-shadow:0 2px 8px rgba(37,99,235,.25);
    }
    .btn.sec{background:#eef2ff; color:#1e3a8a; box-shadow:none}
    .btn.ghost{background:#fff; color:#111; border:1px solid #e5e7eb}
    .note{font-size:13px; color:#6b7280; margin-top:8px}
    .card{
      background:#fff; border-radius:16px; box-shadow:0 1px 26px rgba(17,24,39,.06);
      margin:14px 0; padding:14px; border:1px solid #eef2f7;
    }
    .row{display:grid; grid-template-columns: 1.5fr 160px 1fr 1fr 160px auto; gap:10px; align-items:center}
    .row+.row{margin-top:10px}
    .lab{font-size:12px; color:#6b7280; margin:8px 2px 4px}
    input, select, textarea{
      width:100%; padding:10px 12px; border-radius:12px; border:1px solid #e5e7eb; background:#fff;
      font:inherit; outline:none;
    }
    textarea{min-height:84px; resize:vertical}
    .muted{color:#6b7280}
    .pill{display:inline-block; padding:4px 10px; background:#eef2ff; color:#1e3a8a; border-radius:999px; font-size:12px; font-weight:600}
    .acts{display:flex; align-items:center; gap:10px; justify-content:flex-end}
    .ok{color:#059669; font-weight:600}
    .err{color:#dc2626; font-weight:600}
    .footer{display:flex; justify-content:space-between; align-items:center; margin-top:16px}
    .small{font-size:12px; color:#6b7280}
    .chk{display:flex; align-items:center; gap:8px; font-size:14px}
    @media (max-width:992px){
      .row{grid-template-columns: 1.4fr 150px 1fr 1fr 140px auto}
    }
    @media (max-width:800px){
      .row{grid-template-columns: 1fr}
      .acts{justify-content:flex-start}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Adminbereich</h1>
    <div class="sub" id="statusLine">Angemeldet – <span class="ok">Adminzugriff aktiv.</span></div>

    <div class="topbar">
      <button class="btn" id="addBtn">+ Termin hinzufügen</button>
      <button class="btn sec" id="saveBtn">Änderungen speichern</button>
      <a class="btn ghost" href="../index.html">← Zurück zur Startseite</a>
      <span id="saveState" class="note"></span>
    </div>

    <div id="list"></div>

    <div class="footer">
      <span class="small">Einträge: <span id="count">0</span></span>
      <span class="small muted" id="apiInfo">Speichert direkt nach <code>/content/events.json</code> (GitHub via Vercel Function).</span>
    </div>
  </div>

  <script>
    // --- Konfiguration ---
    const FILE_PATH = "content/events.json";   // Zielpfad im Repo
    const CATEGORIES = [
      {value:"clubmeeting", label:"Clubmeeting"},
      {value:"private-charity", label:"Private Charity"},
      {value:"club-charity", label:"Club Charity"}
    ];

    // --- State ---
    let items = [];

    // --- Utils ---
    const $ = sel => document.querySelector(sel);
    const el = (tag, attrs={}, children=[]) => {
      const n = document.createElement(tag);
      Object.entries(attrs).forEach(([k,v])=>{
        if(k==="class") n.className = v;
        else if(k==="for") n.htmlFor = v;
        else if(k==="text") n.textContent = v;
        else n.setAttribute(k,v);
      });
      (Array.isArray(children)?children:[children]).filter(Boolean).forEach(c=>{
        if(typeof c==="string") n.appendChild(document.createTextNode(c));
        else n.appendChild(c);
      });
      return n;
    };
    const fmt = d => d ? new Date(d).toISOString().slice(0,10) : "";

    function emptyItem(){
      return {
        title: "", category: "clubmeeting",
        start: fmt(new Date()),
        end: "", location: "",
        description: "",
        rsvp_link: "",
        capacity: 0,
        require_signup: false
      };
    }

    // --- Render ---
    function render(){
      const cont = $("#list");
      cont.innerHTML = "";
      items.forEach((it, idx)=>{
        const card = el("div", {class:"card"});
        // Kopfzeile mit Metadaten
        const head = el("div", {class:"row"},
          [
            field("Titel", input("text", it.title, v => {it.title=v})),
            field("Datum", input("date", fmt(it.start), v => { it.start = v ? v+"T00:00:00" : "" })),
            field("Ort", input("text", it.location, v => {it.location=v})),
            field("Kategorie", selectCat(it.category, v => {it.category=v})),
            field("Kapazität", input("number", it.capacity, v => {it.capacity= Number(v||0) })),
            el("div", {class:"acts"}, [
              el("label", {class:"chk"}, [
                checkbox(it.require_signup, v => {it.require_signup = v}),
                el("span", {text:"Anmeldung erforderlich"})
              ]),
              delBtn(idx)
            ])
          ]
        );
        // Beschreibung
        const desc = field("", textarea(it.description, v=>{it.description=v}));
        card.appendChild(head);
        card.appendChild(desc);
        cont.appendChild(card);
      });
      $("#count").textContent = String(items.length);
    }

    function field(label, control){
      return el("div", {}, [
        label ? el("div", {class:"lab", text:label}) : null,
        control
      ]);
    }
    function input(type, value, oninput){
      const i = el("input", {type, value});
      i.addEventListener("input", e=> oninput(e.target.value));
      return i;
    }
    function textarea(value, oninput){
      const t = el("textarea", {}, value);
      t.addEventListener("input", e=> oninput(e.target.value));
      return t;
    }
    function selectCat(value, onchg){
      const s = el("select");
      CATEGORIES.forEach(c=>{
        s.appendChild(el("option", {value:c.value, text:c.label}));
      });
      s.value = value || "clubmeeting";
      s.addEventListener("change", e=> onchg(e.target.value));
      return s;
    }
    function checkbox(checked, onchg){
      const c = el("input", {type:"checkbox"});
      c.checked = !!checked;
      c.addEventListener("change", e=> onchg(e.target.checked));
      return c;
    }
    function delBtn(idx){
      const b = el("button", {class:"btn ghost", type:"button"}, "Löschen");
      b.addEventListener("click", ()=>{
        if(confirm("Diesen Termin löschen?")){ items.splice(idx,1); render(); }
      });
      return b;
    }

    // --- Laden / Speichern ---
    async function load(){
      try{
        const r = await fetch("../content/events.json?ts="+Date.now());
        const j = await r.json();
        items = Array.isArray(j.items) ? j.items : [];
      }catch(e){
        console.error(e);
        items = [];
      }
      render();
    }

    function normalizeForSave(list){
      // sortiere nach Datum aufsteigend, säubere Felder
      const cleaned = list.map(x=>({
        title: (x.title||"").trim(),
        category: (x.category||"clubmeeting").trim(),
        start: (x.start||"").trim(),
        end: (x.end||"").trim(),
        location: (x.location||"").trim(),
        description: (x.description||"").trim(),
        rsvp_link: (x.rsvp_link||"").trim(),
        capacity: Number(x.capacity||0),
        require_signup: !!x.require_signup
      }));
      cleaned.sort((a,b)=> (a.start||"").localeCompare(b.start||""));
      return { items: cleaned };
    }

    async function save(){
      const payload = normalizeForSave(items);
      setSaveState("Speichern …");
      try{
        const res = await fetch("/api/save-events", {
          method:"POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ path: FILE_PATH, content: JSON.stringify(payload, null, 2) })
        });
        if(!res.ok){
          const txt = await res.text();
          throw new Error(txt || ("HTTP "+res.status));
        }
        setSaveState("✓ Gespeichert.");
      }catch(err){
        console.error(err);
        setSaveState("Fehler beim Speichern – Fallback auf manuellen Export.", true);
        // Falls API nicht verfügbar: Datei zum Download anbieten
        download("events.json", JSON.stringify(payload, null, 2));
      }
    }

    function setSaveState(msg, isErr=false){
      const n = $("#saveState");
      n.textContent = msg;
      n.className = "note " + (isErr ? "err" : "ok");
      if(!isErr) setTimeout(()=>{ n.textContent=""; n.className="note"; }, 2500);
    }

    function download(name, text){
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([text], {type:"application/json"}));
      a.download = name;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // --- Events ---
    $("#addBtn").addEventListener("click", ()=>{ items.unshift(emptyItem()); render(); });
    $("#saveBtn").addEventListener("click", save);

    // init
    load();
  </script>
</body>
</html>
